name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Package VSIX
        run: npx --yes @vscode/vsce package --no-dependencies --allow-missing-repository

      - name: Find VSIX file
        id: vsix
        run: echo "file=$(ls *.vsix | head -n 1)" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Simorgh ${{ github.ref_name }}"
          generate_release_notes: true
          files: ${{ steps.vsix.outputs.file }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Marketplace (optional)
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -n "$VSCE_PAT" ]; then
            npx --yes @vscode/vsce publish -p "$VSCE_PAT" --no-dependencies
          else
            echo "VSCE_PAT not set — skipping Marketplace publish."
          fi
        continue-on-error: true
